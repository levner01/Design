name: CI

on:
  push:
    branches: [main, 'glm/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-quick:
    name: verify:quick (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Install dependencies (Node 24 cold install)
        run: corepack pnpm install --frozen-lockfile

      - name: Verify Electron binary
        run: |
          corepack pnpm --filter @designwan/desktop exec electron --version
        shell: bash

      - name: Typecheck
        run: corepack pnpm exec tsc -b

      - name: Build
        run: corepack pnpm build

      - name: verify:quick (with Electron smoke)
        run: corepack pnpm verify:quick
        env:
          # macOS CI 有显示器；Windows CI 也有
          DISABLE_ELECTRON_SMOKE: '0'

  desktop-artifacts:
    name: desktop artifact (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            arch: arm64
          - os: macos-13
            target: mac
            arch: x64
          - os: windows-latest
            target: win
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - run: corepack pnpm install --frozen-lockfile
      - name: Build desktop (tsc + esbuild)
        run: corepack pnpm --filter @designwan/desktop build
      - name: Verify Electron runs
        run: corepack pnpm --filter @designwan/desktop exec electron --version
        shell: bash
      - name: Package smoke (${{ matrix.target }}-${{ matrix.arch }})
        run: corepack pnpm --filter @designwan/desktop exec electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ''
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: List artifacts
        run: |
          ls -la apps/desktop/release/ || true
        shell: bash
      - name: Upload artifact (${{ matrix.target }}-${{ matrix.arch }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*
          if-no-files-found: warn
          retention-days: 7

  not-implemented-gates:
    name: not-implemented gates must fail honestly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - run: corepack pnpm install --frozen-lockfile
      - name: verify:local-data must exit 1
        run: |
          set +e
          corepack pnpm verify:local-data > /tmp/out.log 2>&1
          code=$?
          cat /tmp/out.log
          if [ "$code" -ne 1 ]; then
            echo "verify:local-data must exit 1, got $code"
            exit 1
          fi
      - name: verify:bridge must exit 1
        run: |
          set +e
          corepack pnpm verify:bridge > /tmp/out.log 2>&1
          code=$?
          cat /tmp/out.log
          if [ "$code" -ne 1 ]; then
            echo "verify:bridge must exit 1, got $code"
            exit 1
          fi
      - name: verify:evals:quick must exit 1
        run: |
          set +e
          corepack pnpm verify:evals:quick > /tmp/out.log 2>&1
          code=$?
          cat /tmp/out.log
          if [ "$code" -ne 1 ]; then
            echo "verify:evals:quick must exit 1, got $code"
            exit 1
          fi
      - name: verify:e2e:p0a must exit 1
        run: |
          set +e
          corepack pnpm verify:e2e:p0a > /tmp/out.log 2>&1
          code=$?
          cat /tmp/out.log
          if [ "$code" -ne 1 ]; then
            echo "verify:e2e:p0a must exit 1, got $code"
            exit 1
          fi
      - name: verify:e2e:p0b must exit 1
        run: |
          set +e
          corepack pnpm verify:e2e:p0b > /tmp/out.log 2>&1
          code=$?
          cat /tmp/out.log
          if [ "$code" -ne 1 ]; then
            echo "verify:e2e:p0b must exit 1, got $code"
            exit 1
          fi
      - name: verify:release must exit 1
        run: |
          set +e
          corepack pnpm verify:release > /tmp/out.log 2>&1
          code=$?
          cat /tmp/out.log
          if [ "$code" -ne 1 ]; then
            echo "verify:release must exit 1, got $code"
            exit 1
          fi
