name: CI

on:
  push:
    branches: [main, 'glm/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m0-01-acceptance:
    name: M0-01 (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            target: mac
          - os: macos-13
            arch: x64
            target: mac
          - os: windows-latest
            arch: x64
            target: win
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Frozen install (Node 24 cold install)
        run: corepack pnpm install --frozen-lockfile

      - name: Electron binary check
        run: |
          corepack pnpm --filter @designwan/desktop exec electron --version
        shell: bash

      - name: TypeScript typecheck
        run: corepack pnpm exec tsc -b --force

      - name: Build (no cache)
        run: corepack pnpm exec turbo run build --force

      - name: verify:quick (packaged ready smoke + failures + native host + chrome)
        run: corepack pnpm verify:quick
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Native Host test (explicit)
        run: corepack pnpm --filter @designwan/native-host test
        shell: bash

      - name: Package desktop artifact (${{ matrix.target }}-${{ matrix.arch }})
        run: |
          corepack pnpm --filter @designwan/desktop exec electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ''
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Packaged Ready smoke
        run: |
          node scripts/verify/electron-smoke.mjs
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify artifact exists
        shell: bash
        run: |
          if [ ! -d apps/desktop/release ]; then
            echo "ERROR: apps/desktop/release/ not found"
            exit 1
          fi
          # 检查至少有一个构建产物
          if [ "$(find apps/desktop/release -type f | head -1)" = "" ]; then
            echo "ERROR: no artifact files in release/"
            exit 1
          fi
          echo "Artifacts found:"
          find apps/desktop/release -type f -name "*.dmg" -o -name "*.exe" -o -name "*.app" | head -10

      - name: Upload artifact (${{ matrix.target }}-${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*
          if-no-files-found: error
          retention-days: 7

  not-implemented-gates:
    name: not-implemented gates must fail honestly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - run: corepack pnpm install --frozen-lockfile
      - name: verify:local-data must exit 1
        run: |
          set +e
          corepack pnpm verify:local-data > /tmp/out.log 2>&1
          code=$?
          cat /tmp/out.log
          if [ "$code" -ne 1 ]; then
            echo "verify:local-data must exit 1, got $code"
            exit 1
          fi
      - name: verify:bridge must exit 1
        run: |
          set +e
          corepack pnpm verify:bridge > /tmp/out.log 2>&1
          code=$?
          cat /tmp/out.log
          if [ "$code" -ne 1 ]; then
            echo "verify:bridge must exit 1, got $code"
            exit 1
          fi
      - name: verify:evals:quick must exit 1
        run: |
          set +e
          corepack pnpm verify:evals:quick > /tmp/out.log 2>&1
          code=$?
          cat /tmp/out.log
          if [ "$code" -ne 1 ]; then
            echo "verify:evals:quick must exit 1, got $code"
            exit 1
          fi
      - name: verify:e2e:p0a must exit 1
        run: |
          set +e
          corepack pnpm verify:e2e:p0a > /tmp/out.log 2>&1
          code=$?
          cat /tmp/out.log
          if [ "$code" -ne 1 ]; then
            echo "verify:e2e:p0a must exit 1, got $code"
            exit 1
          fi
      - name: verify:e2e:p0b must exit 1
        run: |
          set +e
          corepack pnpm verify:e2e:p0b > /tmp/out.log 2>&1
          code=$?
          cat /tmp/out.log
          if [ "$code" -ne 1 ]; then
            echo "verify:e2e:p0b must exit 1, got $code"
            exit 1
          fi
      - name: verify:release must exit 1
        run: |
          set +e
          corepack pnpm verify:release > /tmp/out.log 2>&1
          code=$?
          cat /tmp/out.log
          if [ "$code" -ne 1 ]; then
            echo "verify:release must exit 1, got $code"
            exit 1
          fi
