name: CI

on:
  push:
    branches: [main, 'glm/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m0-01-acceptance:
    name: M0-01 (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            target: mac
            artifact_name: desktop-mac-arm64
            # electron-builder --mac --arm64 输出 mac-arm64/
            artifact_glob: apps/desktop/release/mac-arm64/DesignWan.app/Contents/MacOS/DesignWan
          - os: macos-15-intel
            arch: x64
            target: mac
            artifact_name: desktop-mac-x64
            # electron-builder --mac --x64 可能输出 mac/ 或 mac-x64/
            artifact_glob: apps/desktop/release/mac*/DesignWan.app/Contents/MacOS/DesignWan
          - os: windows-latest
            arch: x64
            target: win
            artifact_name: desktop-win-x64
            artifact_glob: apps/desktop/release/win-unpacked/DesignWan.exe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm 11
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Frozen install (Node 24 cold install)
        run: corepack pnpm install --frozen-lockfile

      - name: Electron binary check
        run: |
          corepack pnpm --filter @designwan/desktop exec electron --version
        shell: bash

      - name: TypeScript typecheck
        run: corepack pnpm exec tsc -b --force

      - name: Build (no cache)
        run: corepack pnpm exec turbo run build --force

      - name: verify:quick (packaged ready smoke + failures + native host + chrome)
        run: corepack pnpm verify:quick
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Native Host test (explicit)
        run: corepack pnpm --filter @designwan/native-host test
        shell: bash

      # 第五次整改 §D：每 Job 清理 release 目录，只生成当前 Matrix 架构
      # 避免上一个 Job 残留的旧架构产物被误上传
      - name: Clean release directory before packaging
        run: |
          rm -rf apps/desktop/release/*
          echo "release/ cleaned, ready for ${{ matrix.arch }} packaging"
        shell: bash

      - name: Package desktop artifact (${{ matrix.target }}-${{ matrix.arch }})
        run: |
          corepack pnpm --filter @designwan/desktop exec electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ''
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 第五次整改 §D：解析精确 artifact 路径，供后续 smoke 和上传使用
      - name: Resolve exact artifact path
        id: artifact
        shell: bash
        run: |
          set -e
          GLOB="${{ matrix.artifact_glob }}"
          shopt -s nullglob
          # shellcheck disable=SC2086
          MATCHES=( $GLOB )
          if [ "${#MATCHES[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one artifact matching $GLOB, found ${#MATCHES[@]}"
            echo "release/ contents:"
            ls -la apps/desktop/release/ || true
            find apps/desktop/release -type f 2>/dev/null | head -20 || true
            exit 1
          fi
          ARTIFACT=$(cd "$(dirname "${MATCHES[0]}")" && pwd -P)/$(basename "${MATCHES[0]}")
          echo "path=$ARTIFACT" >> $GITHUB_OUTPUT
          echo "Resolved artifact: $ARTIFACT"

      - name: Packaged Ready smoke (exact artifact, --no-repackage)
        run: |
          node scripts/verify/electron-smoke.mjs --no-repackage --artifact="${{ steps.artifact.outputs.path }}"
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 第五次整改 §D：上传前校验
      # 1. 文件存在
      # 2. 二进制架构与 Matrix 一致
      # 3. 无其他架构旧产物
      - name: Verify artifact architecture matches matrix
        shell: bash
        run: |
          set -e
          ARTIFACT="${{ steps.artifact.outputs.path }}"
          EXPECTED_ARCH="${{ matrix.arch }}"
          EXPECTED_NAME="${{ matrix.artifact_name }}"

          # 1. 文件存在
          if [ ! -f "$ARTIFACT" ]; then
            echo "ERROR: artifact not found at $ARTIFACT"
            exit 1
          fi
          echo "✓ artifact exists: $ARTIFACT"

          # 2. 二进制架构一致
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            FILE_INFO=$(file "$ARTIFACT")
            echo "file info: $FILE_INFO"
            if [[ "$EXPECTED_ARCH" == "arm64" ]]; then
              echo "$FILE_INFO" | grep -q "arm64" || { echo "ERROR: expected arm64, got: $FILE_INFO"; exit 1; }
            elif [[ "$EXPECTED_ARCH" == "x64" ]]; then
              echo "$FILE_INFO" | grep -q "x86_64" || { echo "ERROR: expected x86_64, got: $FILE_INFO"; exit 1; }
            fi
            echo "✓ macOS binary architecture matches: $EXPECTED_ARCH"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            FILE_INFO=$(file "$ARTIFACT")
            echo "file info: $FILE_INFO"
            # x64 Electron must be PE32+ and AMD64/x86-64. PE32/80386 is 32-bit
            # and must never pass the desktop-win-x64 matrix gate.
            echo "$FILE_INFO" | grep -q "PE32+" || { echo "ERROR: expected PE32+ x64 binary, got: $FILE_INFO"; exit 1; }
            echo "$FILE_INFO" | grep -Eqi "x86-64|x86_64|AMD64" || { echo "ERROR: expected AMD64/x86-64, got: $FILE_INFO"; exit 1; }
            if echo "$FILE_INFO" | grep -qi "80386"; then
              echo "ERROR: rejected 32-bit 80386 binary: $FILE_INFO"
              exit 1
            fi
            echo "✓ Windows PE32+ AMD64 binary valid"
          fi

          # 3. 无其他架构旧产物。electron-builder may create metadata/installers,
          # but unpacked app directories are restricted to the active matrix target.
          echo "Release directory contents:"
          ls -la apps/desktop/release/
          UNPACKED_DIRS=( $(find apps/desktop/release -mindepth 1 -maxdepth 1 -type d \( -name 'mac*' -o -name 'win-unpacked' \) -print) )
          for dir in "${UNPACKED_DIRS[@]}"; do
            case "$EXPECTED_NAME:$dir" in
              desktop-mac-arm64:*/mac-arm64|desktop-mac-x64:*/mac|desktop-mac-x64:*/mac-x64|desktop-win-x64:*/win-unpacked) ;;
              *) echo "ERROR: unexpected unpacked artifact directory for $EXPECTED_NAME: $dir"; exit 1 ;;
            esac
          done
          [ "${#UNPACKED_DIRS[@]}" -eq 1 ] || { echo "ERROR: expected exactly one unpacked artifact directory, found ${#UNPACKED_DIRS[@]}"; exit 1; }

          # Full top-level allowlist: metadata/installers for this target are allowed,
          # stale files from another architecture make the job fail loudly.
          for entry in apps/desktop/release/*; do
            name=$(basename "$entry")
            if [ -d "$entry" ]; then
              continue # exact directory allowlist was enforced above
            fi
            case "$EXPECTED_NAME:$name" in
              desktop-mac-arm64:builder-*.yml|desktop-mac-arm64:*-arm64.dmg|desktop-mac-arm64:*-arm64.dmg.blockmap|desktop-mac-arm64:*-arm64.zip|desktop-mac-arm64:*-arm64.zip.blockmap) ;;
              desktop-mac-x64:builder-*.yml|desktop-mac-x64:*.dmg|desktop-mac-x64:*.dmg.blockmap|desktop-mac-x64:*.zip|desktop-mac-x64:*.zip.blockmap)
                [[ "$name" != *-arm64* ]] || { echo "ERROR: arm64 file in x64 release: $name"; exit 1; }
                ;;
              desktop-win-x64:builder-*.yml|desktop-win-x64:*.exe|desktop-win-x64:*.exe.blockmap|desktop-win-x64:latest.yml) ;;
              *) echo "ERROR: release entry is not allowed for $EXPECTED_NAME: $name"; exit 1 ;;
            esac
          done
          echo "Artifact verification passed: $EXPECTED_NAME ($EXPECTED_ARCH)"

      - name: Upload artifact (${{ matrix.artifact_name }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/desktop/release/*
          if-no-files-found: error
          retention-days: 7

  not-implemented-gates:
    name: not-implemented gates must fail honestly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: corepack pnpm install --frozen-lockfile
      - name: verify:local-data must exit 1
        run: |
          set +e
          corepack pnpm verify:local-data > /tmp/out.log 2>&1
          code=$?
          cat /tmp/out.log
          if [ "$code" -ne 1 ]; then
            echo "verify:local-data must exit 1, got $code"
            exit 1
          fi
      - name: verify:bridge must exit 1
        run: |
          set +e
          corepack pnpm verify:bridge > /tmp/out.log 2>&1
          code=$?
          cat /tmp/out.log
          if [ "$code" -ne 1 ]; then
            echo "verify:bridge must exit 1, got $code"
            exit 1
          fi
      - name: verify:evals:quick must exit 1
        run: |
          set +e
          corepack pnpm verify:evals:quick > /tmp/out.log 2>&1
          code=$?
          cat /tmp/out.log
          if [ "$code" -ne 1 ]; then
            echo "verify:evals:quick must exit 1, got $code"
            exit 1
          fi
      - name: verify:e2e:p0a must exit 1
        run: |
          set +e
          corepack pnpm verify:e2e:p0a > /tmp/out.log 2>&1
          code=$?
          cat /tmp/out.log
          if [ "$code" -ne 1 ]; then
            echo "verify:e2e:p0a must exit 1, got $code"
            exit 1
          fi
      - name: verify:e2e:p0b must exit 1
        run: |
          set +e
          corepack pnpm verify:e2e:p0b > /tmp/out.log 2>&1
          code=$?
          cat /tmp/out.log
          if [ "$code" -ne 1 ]; then
            echo "verify:e2e:p0b must exit 1, got $code"
            exit 1
          fi
      - name: verify:release must exit 1
        run: |
          set +e
          corepack pnpm verify:release > /tmp/out.log 2>&1
          code=$?
          cat /tmp/out.log
          if [ "$code" -ne 1 ]; then
            echo "verify:release must exit 1, got $code"
            exit 1
          fi
